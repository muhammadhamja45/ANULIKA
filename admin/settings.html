<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  (function () {
    var t = localStorage.getItem('anulika-theme');
    var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (dark) document.documentElement.classList.add('dark');
  })();
</script>
<title>Pengaturan — Anulika Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
<script src="https://cdn.tailwindcss.com"></script>
<script src="../js/tailwind-config.js"></script>
<link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-neutral-50 text-ink antialiased transition-colors duration-300 dark:bg-neutral-950 dark:text-neutral-100">

<div class="flex min-h-screen">
  <div id="admin-sidebar-backdrop" class="fixed inset-0 z-30 hidden bg-black/40 lg:hidden"></div>
  <aside id="admin-sidebar" class="fixed inset-y-0 left-0 z-40 flex w-64 -translate-x-full flex-col bg-white transition-transform duration-200 dark:bg-neutral-950 lg:static lg:translate-x-0 lg:border-r lg:border-neutral-200 lg:dark:border-neutral-800"></aside>
  <div class="flex min-w-0 flex-1 flex-col">
    <header id="admin-topbar" class="flex h-16 shrink-0 items-center gap-2 border-b border-neutral-200 bg-white px-4 dark:border-neutral-800 dark:bg-neutral-950 sm:px-6"></header>
    <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
      <div class="mb-8">
        <h1 class="font-display text-3xl text-neutral-900 dark:text-white">Pengaturan</h1>
        <p class="mt-1 text-sm text-neutral-500 dark:text-neutral-400">Kelola ketersediaan booking dan akun Anda.</p>
      </div>

      <div class="grid gap-6 lg:grid-cols-2">
        <div id="booking-availability-card" class="rounded-lg border border-neutral-200 bg-white p-6 dark:border-neutral-800 dark:bg-neutral-900">
          <h2 class="font-medium text-neutral-900 dark:text-white">Ketersediaan Booking</h2>
          <p class="mt-1 text-sm text-neutral-500 dark:text-neutral-400">Jika dimatikan, halaman booking publik akan menampilkan pesan tidak tersedia dan menyembunyikan formulir.</p>
          <label class="mt-4 flex items-center gap-3">
            <input type="checkbox" id="booking-open-toggle" class="h-5 w-5">
            <span id="booking-open-label" class="text-sm font-medium text-neutral-900 dark:text-white">Booking Terbuka</span>
          </label>
        </div>

        <div class="rounded-lg border border-neutral-200 bg-white p-6 dark:border-neutral-800 dark:bg-neutral-900">
          <h2 class="font-medium text-neutral-900 dark:text-white">Ubah Password</h2>
          <p class="mt-1 text-sm text-neutral-500 dark:text-neutral-400">Perbarui password akun Anda sendiri.</p>
          <form id="password-form" class="mt-4 space-y-4">
            <div>
              <label class="mb-1.5 block text-xs uppercase tracking-widest text-neutral-400">Password Baru *</label>
              <input type="password" id="new-password" required minlength="6" class="w-full border border-neutral-300 bg-transparent px-4 py-2.5 text-sm focus:border-neutral-900 focus:outline-none dark:border-neutral-700 dark:focus:border-white">
            </div>
            <p id="password-form-error" class="hidden border border-red-200 bg-red-50 px-4 py-2.5 text-sm text-red-600 dark:border-red-900 dark:bg-red-950 dark:text-red-400"></p>
            <button type="submit" class="bg-neutral-900 px-5 py-2.5 text-sm text-white dark:bg-white dark:text-neutral-900">Simpan Password</button>
          </form>
        </div>

        <div class="rounded-lg border border-neutral-200 bg-white p-6 dark:border-neutral-800 dark:bg-neutral-900 lg:col-span-2">
          <h2 class="font-medium text-neutral-900 dark:text-white">Akun Saya</h2>
          <dl id="account-info" class="mt-4 max-w-sm space-y-2 text-sm"></dl>
        </div>
      </div>
    </main>
  </div>
</div>

<div id="admin-modal-root"></div>
<div id="admin-toast-root" class="fixed bottom-4 right-4 z-[60] space-y-2"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script type="module" src="../js/admin/settings.js"></script>
</body>
</html>
